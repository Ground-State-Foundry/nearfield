[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nearfield"
version = "1.0.0"
description = "Real-time caller voice isolation: keeps the near voice, removes noise and background voices."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ground State Foundry" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "onnxruntime>=1.16", "soxr>=0.3"]
keywords = ["noise suppression", "voice isolation", "speech enhancement", "pipecat", "real-time", "onnx"]

[project.optional-dependencies]
pipecat = ["pipecat-ai"]

[project.urls]
Homepage = "https://github.com/ground-state-foundry/nearfield"

[tool.hatch.build.targets.wheel]
packages = ["src/nearfield"]
